<title>SPEAK IT! - Vocabulary</title>

<style>

.meaning{color:#7956b8;font-weight:bold}
.example{background:#f8f6ff;padding:12px;border-radius:12px;margin-top:12px}

.word-actions button.selected{background:#b9e8d1;color:#245d43}
.progress-track{background:#ddd5ef;height:12px;border-radius:20px;overflow:hidden;margin-top:12px}
.progress-fill{background:#8c6bd1;height:100%;width:0%;transition:width .2s}

<body>
<main class="vocab-page">

<a class="back-link" href="index.html">← Back to Home</a>

<section class="vocab-top">
<p>YOUR DAILY VOCABULARY ✨</p>
<h1 id="dayTitle">DAY 01</h1>
<p id="dayDescription">오늘의 새로운 영어를 만나 봐요!</p>

["Not really.","딱히 그렇진 않아.","Not really. I'm okay.","딱히 그렇진 않아. 난 괜찮아."],

const today = new Date();
const todayKey = today.getFullYear() + "-" +
  String(today.getMonth()+1).padStart(2,"0") + "-" +
  String(today.getDate()).padStart(2,"0");

let startDate = localStorage.getItem("speakItStartDate");

if (!startDate) {
  startDate = todayKey;
  localStorage.setItem("speakItStartDate", startDate);
}

function dateNumber(dateString) {
  const parts = dateString.split("-").map(Number);
  return Date.UTC(parts[0],parts[1]-1,parts[2]);
}

const elapsed = Math.floor(
  (dateNumber(todayKey)-dateNumber(startDate))/86400000
);

const dayIndex = Math.max(0,elapsed);
const words = wordPacks[dayIndex];

let saved = JSON.parse(
  localStorage.getItem("speakItProgress") || "{}"
);

function speak(text) {
  if (!("speechSynthesis" in window)) {
    alert("이 브라우저에서는 발음 듣기를 지원하지 않아요.");
    return;
  }
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  speechSynthesis.speak(utterance);
}

function addDaysToDate(dateString, days) {
  const [year, month, day] = dateString.split("-").map(Number);
  const date = new Date(year, month - 1, day);
  date.setDate(date.getDate() + days);

  return date.getFullYear() + "-" +
    String(date.getMonth() + 1).padStart(2, "0") + "-" +
    String(date.getDate()).padStart(2, "0");
}

function setStatus(index, status) {
  const key = "day" + (dayIndex + 1) + "_" + index;

  let schedule = JSON.parse(
    localStorage.getItem("speakItReviewSchedule") || "{}"
  );

  if (saved[key] === status) {
    delete saved[key];
    delete schedule[key];
  } else {
    saved[key] = status;

    schedule[key] = {
      stage: 0,
      nextDate: addDaysToDate(todayKey, 1)
    };
  }

  localStorage.setItem("speakItProgress", JSON.stringify(saved));
  localStorage.setItem("speakItReviewSchedule", JSON.stringify(schedule));

  renderWords();
}
function renderWords() {
  const list = document.getElementById("wordList");

  if (!words) {
    document.getElementById("dayTitle").textContent =
      "DAY " + String(dayIndex+1).padStart(2,"0");

    document.getElementById("dayDescription").textContent =
      "새로운 단어가 준비 중이에요!";

    document.getElementById("progressText").textContent =
      "다음 학습 자료를 준비하고 있어요.";

    document.getElementById("progressFill").style.width = "0%";

    list.innerHTML =
      "<div class='word-card'><h3>Coming Soon! ✨</h3><p>새로운 단어 40개를 곧 추가할게요.</p></div>";
    return;
  }

  document.getElementById("dayTitle").textContent =
    "DAY " + String(dayIndex+1).padStart(2,"0") +
    " - Let's get started!";

  document.getElementById("dayDescription").textContent =
    "오늘의 새로운 영어 표현 40개를 만나 봐요.";

  const count = words.filter((word,index) =>
    saved["day"+(dayIndex+1)+"_"+index] === "known"
  ).length;

  document.getElementById("progressText").textContent =
    count + " / 40 learned";

  document.getElementById("progressFill").style.width =
    (count/40*100) + "%";

  list.innerHTML = words.map((word,index) => {
    const key = "day"+(dayIndex+1)+"_"+index;

    return `
      <article class="word-card">
        <h3>${index+1}. ${word[0]}</h3>
        <p class="meaning">${word[1]}</p>

        <div class="example">
          <p>${word[2]}</p>
          <p>${word[3]}</p>
        </div>

        <div class="word-actions">
          <button onclick="speak(words[${index}][0])">
            🔊 단어 듣기
          </button>
          <button onclick="speak(words[${index}][2])">
            🔊 예문 듣기
          </button>
          <button class="${saved[key]==='known'?'selected':''}"
            onclick="setStatus(${index},'known')">
            ✓ 알고 있어요
          </button>
          <button class="${saved[key]==='review'?'selected':''}"
            onclick="setStatus(${index},'review')">
            ↻ 복습 필요
          </button>
        </div>
      </article>
    `;
  }).join("");
}

renderWords();
</script>

</html>
