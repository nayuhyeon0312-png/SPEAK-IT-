<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPEAK IT! - Listening</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f7f8fc;
  color: #30364a;
}

.container { max-width: 850px; margin: auto; }
h1 { color: #6578d3; }

.card {
  background: white;
  padding: 20px;
  border-radius: 18px;
  margin: 18px 0;
  box-shadow: 0 4px 15px #0000000a;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
  margin: 10px 0;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 18px;
  background: #7488e5;
  color: white;
  font-size: 15px;
  cursor: pointer;
  margin: 4px;
}

button:disabled {
  opacity: 0.5;
  cursor: wait;
}

.video {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #222;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
}

#youtubePlayer {
  width: 100%;
  height: 100%;
}

.subtitle-overlay {
  position: absolute;
  left: 3%;
  right: 3%;
  bottom: 7%;
  text-align: center;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.subtitle-line {
  display: table;
  max-width: 100%;
  margin: auto;
  padding: 7px 12px;
  border-radius: 7px;
  color: white;
  background: #000c;
  font-size: clamp(14px, 3vw, 22px);
  line-height: 1.4;
  overflow-wrap: anywhere;
}

#koreanSubtitle { color: #ffe6a8; }

.status {
  color: #6578d3;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
}

.note {
  background: #f0f2ff;
  padding: 14px;
  border-radius: 12px;
  line-height: 1.7;
}

a { color: #6578d3; }
</style>
</head>

<body>
<div class="container">

  <a href="index.html">← 홈으로</a>

  <h1>🎧 Listening</h1>
  <p>영상과 함께 영어를 듣고 한국어 뜻도 확인해 봐요!</p>

  <div class="card">
    <h2>📺 유튜브 영상</h2>

    <input
      id="videoUrl"
      placeholder="유튜브 영상 주소를 입력하세요"
    >

    <button onclick="loadVideo()">영상 불러오기</button>

    <button id="subtitleButton" onclick="loadAutoSubtitles()">
      ✨ AI 자막 생성 및 번역
    </button>

    <p id="videoStatus" class="status">
      유튜브 주소를 입력해 주세요.
    </p>
  </div>

  <div class="card">
    <h2>▶️ 영상 플레이어</h2>

    <div class="video">
      <div id="youtubePlayer"></div>

      <div class="subtitle-overlay">
        <div id="englishSubtitle" class="subtitle-line"></div>
        <div id="koreanSubtitle" class="subtitle-line"></div>
      </div>
    </div>

    <div style="margin-top:12px;">
      <button onclick="toggleEnglish()">EN 영어 자막</button>
      <button onclick="toggleKorean()">KO 한국어 자막</button>
    </div>

    <p class="note">
      영상 재생 시간에 맞춰 영어와 한국어 자막이 자동으로 바뀝니다.
    </p>

    <p id="subtitleStatus" class="status">
      아직 자막을 불러오지 않았어요.
    </p>
  </div>

</div>

<script>
const API_URL =
  "https://mellow-watch-learn.onrender.com/api/transcript";

let player = null;
let captions = [];
let syncTimer = null;
let showEnglish = true;
let showKorean = true;
let pendingVideoId = null;
let youtubeReady = false;

function getVideoId(value) {
  try {
    const url = new URL(value);
    const host = url.hostname.replace(/^www\./, "");

    if (host === "youtu.be") {
      return url.pathname.split("/").filter(Boolean)[0] || "";
    }

    if (host === "youtube.com" || host === "m.youtube.com") {
      return url.searchParams.get("v") ||
        (url.pathname.match(/^\/(?:embed|shorts|live)\/([^/?]+)/) || [])[1] || "";
    }
  } catch (error) {}

  return "";
}

function createPlayer(videoId) {
  if (!youtubeReady || !window.YT || !YT.Player) {
    pendingVideoId = videoId;
    return;
  }

  if (player && player.destroy) {
    player.destroy();
    player = null;
  }

  document.getElementById("youtubePlayer").innerHTML = "";

  player = new YT.Player("youtubePlayer", {
    videoId: videoId,
    playerVars: {
      playsinline: 1,
      rel: 0
    },
    events: {
      onReady: function() {
        document.getElementById("videoStatus").textContent =
          "영상이 준비됐어요!";
        startSync();
      },
      onError: function() {
        document.getElementById("videoStatus").textContent =
          "이 영상은 외부 재생이 제한되어 있을 수 있어요.";
      }
    }
  });
}

function loadVideo() {
  const url = document.getElementById("videoUrl").value.trim();
  const videoId = getVideoId(url);

  if (!videoId) {
    alert("올바른 유튜브 주소를 입력해 주세요.");
    return;
  }

  captions = [];
  updateSubtitles();

  document.getElementById("subtitleStatus").textContent =
    "새 영상의 자막을 기다리고 있어요.";

  document.getElementById("videoStatus").textContent =
    "영상을 불러오고 있어요...";

  createPlayer(videoId);
}

async function loadAutoSubtitles() {
  const url = document.getElementById("videoUrl").value.trim();
  const videoId = getVideoId(url);
  const button = document.getElementById("subtitleButton");

  if (!videoId) {
    alert("먼저 올바른 유튜브 주소를 입력해 주세요.");
    return;
  }

  button.disabled = true;
  button.textContent = "⏳ AI 자막 만드는 중...";
  document.getElementById("subtitleStatus").textContent =
    "영어 자막을 가져오고 한국어로 번역하고 있어요.\n영상에 따라 시간이 걸릴 수 있어요.";

  captions = [];
  updateSubtitles();

  try {
    const response = await fetch(
      API_URL + "?url=" + encodeURIComponent(url)
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "자막을 가져오지 못했어요.");
    }

    if (!Array.isArray(data.segments) || data.segments.length === 0) {
      throw new Error("표시할 자막이 없어요.");
    }

    captions = data.segments
      .map(item => ({
        start: Number(item.start),
        end: Number(item.end),
        en: String(item.en || ""),
        ko: String(item.ko || "")
      }))
      .filter(item =>
        Number.isFinite(item.start) &&
        Number.isFinite(item.end)
      )
      .sort((a, b) => a.start - b.start);

    document.getElementById("subtitleStatus").textContent =
      "🎉 자막 준비 완료!\n영어와 한국어 자막 " +
      captions.length + "개를 불러왔어요.";

    updateSubtitles();

  } catch (error) {
    document.getElementById("subtitleStatus").textContent =
      "자막 오류: " + error.message;
  } finally {
    button.disabled = false;
    button.textContent = "✨ AI 자막 생성 및 번역";
  }
}

function updateSubtitles() {
  let current = null;

  if (player && player.getCurrentTime) {
    const time = player.getCurrentTime();

    current = captions.find(item =>
      time >= item.start && time < item.end
    );
  }

  document.getElementById("englishSubtitle").textContent =
    current && showEnglish ? current.en : "";

  document.getElementById("koreanSubtitle").textContent =
    current && showKorean ? current.ko : "";
}

function startSync() {
  if (syncTimer) clearInterval(syncTimer);
  syncTimer = setInterval(updateSubtitles, 200);
}

function toggleEnglish() {
  showEnglish = !showEnglish;
  updateSubtitles();
}

function toggleKorean() {
  showKorean = !showKorean;
  updateSubtitles();
}

window.onYouTubeIframeAPIReady = function() {
  youtubeReady = true;

  if (pendingVideoId) {
    const id = pendingVideoId;
    pendingVideoId = null;
    createPlayer(id);
  }

  document.getElementById("videoStatus").textContent =
    "유튜브 플레이어를 사용할 준비가 됐어요.";
};

const youtubeScript = document.createElement("script");
youtubeScript.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(youtubeScript);
</script>

</body>
</html>
