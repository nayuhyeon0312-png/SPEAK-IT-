<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPEAK IT! - Listening</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f7f8fc;
  color: #30364a;
}
.container {
  max-width: 800px;
  margin: auto;
}
h1 { color: #6578d3; }
.card {
  background: white;
  padding: 20px;
  border-radius: 18px;
  margin: 18px 0;
  box-shadow: 0 4px 15px #0000000a;
}
input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
  margin: 10px 0;
}
button {
  border: 0;
  border-radius: 10px;
  padding: 12px 18px;
  background: #7488e5;
  color: white;
  font-size: 15px;
  cursor: pointer;
  margin: 4px;
}
.video {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #222;
  border-radius: 14px;
  overflow: hidden;
}
iframe {
  width: 100%;
  height: 100%;
  border: 0;
}
.tip {
  background: #f0f2ff;
  padding: 15px;
  border-radius: 12px;
  line-height: 1.7;
}
a { color: #6578d3; }
</style>
</head>
<body>
<div class="container">
  <a href="index.html">← 홈으로</a>
  <h1>🎧 Listening</h1>
  <p>카툰과 영상으로 자연스러운 영어 듣기에 익숙해져 봐요!</p>
  <div class="card">
    <h2>📺 영상 불러오기</h2>
    <p>유튜브 영상 주소를 붙여넣어 주세요.</p>
    <input id="videoUrl" placeholder="YouTube 영상 주소를 입력하세요">
    <button onclick="loadVideo()">영상 불러오기</button>
  </div>
  <div class="card">
    <h2>▶️ 영상 플레이어</h2>
    <div class="video" id="player">
      <p style="color:white;text-align:center;padding:30px;">
        영상을 불러오면 여기에 표시돼요.
      </p>
    </div>
  </div>
  <div class="card">
    <h2>💡 듣기 연습 방법</h2>
    <div class="tip">
      <p><b>1. 먼저 자막 없이 들어보기</b><br>
      전체적인 상황과 대화를 파악해 봐요.</p>
      <p><b>2. 영어 자막과 함께 들어보기</b><br>
      들리지 않았던 단어와 표현을 확인해요.</p>
      <p><b>3. 한 문장씩 따라 말하기</b><br>
      등장인물의 발음과 억양을 흉내 내 봐요.</p>
      <p><b>4. 다시 자막 없이 들어보기</b><br>
      처음보다 얼마나 잘 들리는지 확인해요.</p>
    </div>
  </div>
</div>
<script>
function loadVideo() {
  const url = document.getElementById("videoUrl").value.trim();
  const player = document.getElementById("player");
  let videoId = "";
  try {
    const parsed = new URL(url);
    if (parsed.hostname.includes("youtu.be")) {
      videoId = parsed.pathname.slice(1);
    } else if (parsed.hostname.includes("youtube.com")) {
      videoId = parsed.searchParams.get("v") || "";
      if (!videoId && parsed.pathname.includes("/shorts/")) {
        videoId = parsed.pathname.split("/shorts/")[1].split("/")[0];
      }
    }
  } catch (error) {
    videoId = "";
  }
  if (!videoId) {
    alert("올바른 유튜브 주소를 입력해 주세요!");
    return;
  }
  player.innerHTML = `
    <iframe
      src="https://www.youtube.com/embed/${encodeURIComponent(videoId)}?cc_load_policy=1"
      title="YouTube video player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  `;
}
</script>
</body>
</html>
